
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Royal Digital | Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --gold:#d4af37;
  --bg:#080808;
  --panel:#151515;
  --line:#292929;
  --muted:#aaa;
}
* {box-sizing:border-box}
body {
  margin:0;background:var(--bg);color:#fff;
  font-family:Arial,sans-serif;
}
button,input,textarea,select {font:inherit}
button {
  cursor:pointer;border:0;border-radius:7px;
  padding:12px 16px;background:var(--gold);
  color:#080808;font-weight:bold;
}
input,textarea,select {
  width:100%;padding:13px;margin:7px 0 14px;
  background:#090909;color:#fff;
  border:1px solid #444;border-radius:7px;
}
textarea {min-height:85px}
label {font-size:13px;color:#ccc}
.login {
  max-width:420px;margin:12vh auto;padding:28px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:12px;
}
h1,h2 {color:var(--gold)}
.logo {
  text-align:center;font-size:25px;
  font-weight:bold;letter-spacing:2px;
}
.muted {color:var(--muted);font-size:13px}
#app {display:none}
header {
  padding:18px 5%;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;
}
header strong {color:var(--gold);font-size:20px}
main {max-width:1100px;margin:auto;padding:24px 16px}
.tabs {
  display:flex;gap:8px;overflow-x:auto;padding:12px 0;
}
.tabs button {white-space:nowrap;background:#222;color:#fff}
.tabs button.active {background:var(--gold);color:#000}
.toolbar {
  display:flex;justify-content:space-between;
  align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0;
}
.panel {
  background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:18px;margin-bottom:14px;
}
.item {
  border-bottom:1px solid var(--line);
  padding:16px 0;display:flex;
  justify-content:space-between;gap:14px;align-items:center;
}
.item:last-child {border:0}
.item-info {
  display:flex;align-items:center;gap:14px;
  min-width:0;
}
.item small {
  display:block;color:var(--muted);margin-top:5px;
  overflow-wrap:anywhere;
}
.actions {display:flex;gap:6px;flex-wrap:wrap}
.actions button {padding:8px 10px;font-size:12px}
.secondary {background:#333;color:#fff}
.danger {background:#a83232;color:#fff}
#message {color:var(--gold);margin:12px 0}
.hidden {display:none!important}
.thumb {
  width:76px;height:76px;flex-shrink:0;
  object-fit:contain;background:#080808;
  border:1px solid var(--line);border-radius:8px;padding:5px;
}
.thumb.client-logo {background:#fff}
.video-thumb {
  width:76px;height:76px;flex-shrink:0;
  background:#080808;border:1px solid var(--line);
  border-radius:8px;display:flex;
  justify-content:center;align-items:center;
  color:var(--gold);font-size:25px;
}
.status {
  display:inline-block;font-size:11px;
  padding:4px 8px;border-radius:20px;
  background:#242424;color:var(--gold);margin-top:6px;
}
.empty {color:var(--muted);padding:18px 0}
@media(max-width:600px) {
  header {align-items:flex-start}
  header strong {font-size:16px}
  .item {align-items:flex-start;flex-direction:column}
  .item-info {width:100%}
  .login {margin:8vh 15px}
}

/* Portfolio add-content modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}
.modal-backdrop.show{display:flex}
.content-modal{width:min(100%,520px);max-height:92vh;overflow:auto;background:#141414;border:1px solid #8c7029;border-radius:16px;padding:22px;box-shadow:0 18px 60px #000}
.content-modal h2{margin:0 0 6px;color:var(--gold)}
.content-modal .hint{font-size:12px;color:#aaa;margin:0 0 18px}
.content-modal .field{margin:12px 0}
.content-modal label{display:block;margin-bottom:5px;color:#ddd}
.content-modal select,.content-modal input,.content-modal textarea{margin:0;background:#090909;border-color:#55451e}
.content-modal .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.content-modal .secondary{background:#333;color:#fff}
.content-modal .checkline{display:flex;align-items:center;gap:9px;margin-top:12px;color:#ddd;font-size:13px}
.content-modal .checkline input{width:auto;margin:0;accent-color:var(--gold)}

</style>
</head>

<body>

<section class="login" id="loginBox">
  <div class="logo">ROYAL <span style="color:#d4af37">DIGITAL</span></div>
  <h2>Admin Login</h2>
  <p class="muted">Sign in to manage your website.</p>

  <label>Email Address</label>
  <input id="email" type="email" placeholder="Your admin email">

  <label>Password</label>
  <input id="password" type="password" placeholder="Your password">

  <button style="width:100%" onclick="login()">Sign In</button>
  <p id="loginMessage" class="muted"></p>
</section>

<div id="app">
<header>
  <strong>ROYAL DIGITAL ADMIN</strong>
  <button class="secondary" onclick="logout()">Logout</button>
</header>

<main>
  <h1>Dashboard</h1>
  <p class="muted">Manage your website content from here.</p>

  <div class="tabs" id="tabs">
    <button class="active" data-table="clients">Our Clients</button>
    <button data-table="client_portfolio">Client Videos & Pictures</button>
    <button data-table="projects">Legacy Projects</button>
    <button data-table="highlights">Royal Digital Highlights</button>
    <button data-table="spotlight">Royal Digital Spotlight</button>
    <button data-table="testimonials">Testimonials</button>
    <button data-table="packages">Packages</button>
  </div>

  <div class="toolbar">
    <h2 id="sectionTitle">Projects</h2>
    <button onclick="addItem()">+ Add New</button>
  </div>

  <div id="message"></div>
  <div class="panel" id="records">Loading...</div>
  <p class="muted">Royal Digital — Private Admin Area</p>
</main>
</div>

<input type="file" id="filePicker" class="hidden" accept="image/*,video/mp4,video/webm,video/quicktime">


<div class="modal-backdrop" id="portfolioModal" aria-hidden="true">
 <form class="content-modal" id="portfolioForm">
  <h2>Add Client Content</h2>
  <p class="hint" id="portfolioClientHint">Choose the content type and source below.</p>
  <div class="field"><label for="portfolioContentType">Content Type</label><select id="portfolioContentType"><option value="video">Video</option><option value="post">Post / Picture</option></select></div>
  <div class="field"><label for="portfolioSource">Content Source</label><select id="portfolioSource"></select></div>
  <div class="field"><label for="portfolioTitle">Title (optional)</label><input id="portfolioTitle" type="text" placeholder="e.g. Restaurant Promotional Reel"></div>
  <div class="field"><label for="portfolioDescription">Description (optional)</label><textarea id="portfolioDescription" placeholder="Add a short description..."></textarea></div>
  <div class="field hidden" id="portfolioUrlWrap"><label for="portfolioUrl" id="portfolioUrlLabel">Content URL</label><input id="portfolioUrl" type="url" placeholder="Paste public link here"></div>
  <label class="checkline"><input id="portfolioPublish" type="checkbox" checked> Publish this content now</label>
  <div class="modal-actions"><button type="button" class="secondary" id="portfolioCancel">Cancel</button><button type="submit">Continue</button></div>
 </form>
</div>

<script>
const SUPABASE_URL = "https://kwczmrtgzuijunwkvkej.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_-O2kws00bL8L1nXiCVOlag_zhVa9mac";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let currentTable = "clients";
let currentUpload = null;
let activeClientId = null;
let portfolioTypeFilter = "all";
const configs = {
  projects:{title:"Legacy Projects",fields:[["title","Project title"],["category","Category"],["description","Description"],["cover_image_url","Cover image URL"],["video_url","Old video URL"]],flags:["is_featured","is_published"]},
  clients:{title:"Clients",fields:[["name","Client name"],["logo_url","Logo image URL"],["display_order","Display order"]],flags:["is_visible"]},
  testimonials:{title:"Testimonials",fields:[["client_name","Client name"],["content","Testimonial"],["rating","Rating (1 to 5)"]],flags:["is_published"]},
  packages:{title:"Packages",fields:[["name","Package name"],["starting_price","Starting price"],["description","Description"],["features","Features (separate with commas)"],["display_order","Display order"]],flags:["is_active"]}
};
function say(m){document.getElementById('message').textContent=m;}
function offerFilePicker(message){
 const box=document.getElementById('message');box.textContent=message+' ';
 const btn=document.createElement('button');btn.type='button';btn.className='secondary';btn.textContent='Choose file from phone';
 btn.addEventListener('click',()=>{const p=document.getElementById('filePicker');p.click();});
 box.appendChild(btn);
}
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,output=document.getElementById('loginMessage');output.textContent='Signing in...';const {error}=await db.auth.signInWithPassword({email,password});if(error){output.textContent=error.message;return;}await showApp();}
async function logout(){await db.auth.signOut();document.getElementById('app').style.display='none';document.getElementById('loginBox').style.display='block';}
async function showApp(){document.getElementById('loginBox').style.display='none';document.getElementById('app').style.display='block';await loadRecords();}
function setTabs(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.table===currentTable));}
async function loadRecords(){setTabs();const box=document.getElementById('records');box.textContent='Loading...';
 if(currentTable==='client_portfolio') return loadClientPortfolio();
 if(currentTable==='spotlight' || currentTable==='highlights') return loadSpotlight();
 const cfg=configs[currentTable];document.getElementById('sectionTitle').textContent=cfg.title;
 const {data,error}=await db.from(currentTable).select('*').order('created_at',{ascending:false});if(error){box.textContent=error.message;return;}
 if(!data?.length){box.innerHTML='<div class="empty">No records yet. Tap Add New to create one.</div>';return;}
 box.innerHTML=data.map(row=>{const name=row.title||row.name||row.client_name||'Record',detail=row.category||row.starting_price||row.content||'',preview=(currentTable==='clients'&&row.logo_url)?`<img class="thumb client-logo" src="${safe(row.logo_url)}">`:((currentTable==='projects'&&row.cover_image_url)?`<img class="thumb" src="${safe(row.cover_image_url)}">`:'<div class="video-thumb">RD</div>');const flag=row.is_published!==undefined?row.is_published?'Published':'Draft':row.is_visible!==undefined?row.is_visible?'Visible':'Hidden':row.is_active!==undefined?row.is_active?'Active':'Inactive':'';return `<div class="item"><div class="item-info">${preview}<div><strong>${safe(name)}</strong><small>${safe(detail)}</small>${flag?`<span class="status">${flag}</span>`:''}</div></div><div class="actions"><button class="secondary" data-action="edit" data-id="${safe(row.id)}">Edit</button>${['clients','projects'].includes(currentTable)?`<button class="secondary" data-action="upload" data-id="${safe(row.id)}">Upload</button>`:''}${currentTable==='clients'?`<button data-action="manage-portfolio" data-id="${safe(row.id)}">Manage Videos & Pictures</button>`:''}<button class="danger" data-action="delete" data-id="${safe(row.id)}">Delete</button></div></div>`}).join('');}
async function loadClientPortfolio(){
 document.getElementById('sectionTitle').textContent='Client Videos & Pictures';
 const box=document.getElementById('records');
 const [{data:items,error},{data:clients,error:ce}]=await Promise.all([
  db.from('client_portfolio_items').select('*, clients(name)').order('created_at',{ascending:false}),
  db.from('clients').select('id,name').order('display_order',{ascending:true})
 ]);
 if(error||ce){box.textContent=(error||ce).message;return;}
 if(!clients?.length){box.innerHTML='<div class="empty">No clients found. Add a client first.</div>';return;}
 if(!activeClientId || !clients.some(c=>String(c.id)===String(activeClientId))) activeClientId=clients[0].id;
 const selected=clients.find(c=>String(c.id)===String(activeClientId));
 const filtered=(items||[]).filter(x=>String(x.client_id)===String(activeClientId) && (portfolioTypeFilter==='all'||x.content_type===portfolioTypeFilter));
 const selector=`<div style="margin-bottom:16px"><label for="portfolioClient">Select client</label><select id="portfolioClient">${clients.map(c=>`<option value="${safe(c.id)}" ${String(c.id)===String(activeClientId)?'selected':''}>${safe(c.name)}</option>`).join('')}</select><div class="actions"><button type="button" class="${portfolioTypeFilter==='all'?'':'secondary'}" data-filter="all">All</button><button type="button" class="${portfolioTypeFilter==='video'?'':'secondary'}" data-filter="video">Videos</button><button type="button" class="${portfolioTypeFilter==='post'?'':'secondary'}" data-filter="post">Pictures / Posts</button></div></div>`;
 const content=filtered.length?filtered.map(x=>`<div class="item"><div class="item-info">${x.content_type==='post'&&x.image_url?`<img class="thumb" src="${safe(x.image_url)}" alt="Post image">`:'<div class="video-thumb">▶</div>'}<div><strong>${safe(x.title||(x.content_type==='video'?'YouTube Video':'Post'))}</strong><small>${safe(x.instagram_url?'Instagram embed':x.video_file_url?'Uploaded video':x.youtube_url?'YouTube video':'Picture / Post')}</small><small>${safe(x.instagram_url||x.video_file_url||x.youtube_url||x.image_url||'')}</small><span class="status">${x.is_published?'Published':'Draft'}</span></div></div><div class="actions"><button class="secondary" data-action="edit" data-id="${safe(x.id)}">Edit</button>${x.content_type==='post'?`<button class="secondary" data-action="upload-item" data-id="${safe(x.id)}">Replace Image</button>`:''}<button class="danger" data-action="delete" data-id="${safe(x.id)}">Delete</button></div></div>`).join(''):`<div class="empty">No ${portfolioTypeFilter==='all'?'videos or pictures':portfolioTypeFilter==='video'?'videos':'pictures'} for ${safe(selected.name)} yet. Tap Add New to add content.</div>`;
 box.innerHTML=selector+content;
}
async function loadSpotlight(){
 const isHighlights=currentTable==='highlights';
 document.getElementById('sectionTitle').textContent=isHighlights?'Royal Digital Highlights':'Royal Digital Spotlight';
 const box=document.getElementById('records');
 let query=db.from('spotlight_items').select('*').eq('is_highlight',isHighlights).order('created_at',{ascending:false});
 const {data,error}=await query;
 if(error){box.textContent=error.message+' — Run the split Highlights / Spotlight SQL first.';return;}
 if(!data?.length){box.innerHTML=`<div class="empty">No ${isHighlights?'Highlights':'Spotlight'} content yet. Tap Add New to create one.</div>`;return;}
 box.innerHTML=data.map(x=>`<div class="item"><div class="item-info"><div class="video-thumb">${x.content_type==='video'?'▶':'RD'}</div><div><strong>${safe(x.title)}</strong><small>${safe(x.content_type)} · ${safe(x.video_file_url||x.video_url||x.youtube_url||x.description||'')}</small><span class="status">${x.is_published?'Published':'Draft'}</span></div></div><div class="actions"><button class="secondary" data-action="edit" data-id="${safe(x.id)}">Edit</button>${x.content_type==='video'?`<button class="secondary" data-action="upload-highlight-video" data-id="${safe(x.id)}">Upload / Replace Video</button>`:''}<button class="danger" data-action="delete" data-id="${safe(x.id)}">Delete</button></div></div>`).join('');
}
async function addItem(){if(currentTable==='client_portfolio')return addPortfolioItem();if(currentTable==='spotlight'||currentTable==='highlights')return addSpotlightItem();const cfg=configs[currentTable],record={};for(const [key,label] of cfg.fields){let v=prompt(label);if(v===null)return;record[key]=key==='features'?v.split(',').map(x=>x.trim()).filter(Boolean):['display_order','rating'].includes(key)?Number(v||0):v;}cfg.flags.forEach(f=>record[f]=confirm('Enable '+f.replaceAll('_',' ')+'?'));const {error}=await db.from(currentTable).insert(record);if(error){say(error.message);return;}say('Record added.');loadRecords();}
async function addPortfolioItem(){
 const {data:clients,error}=await db.from('clients').select('id,name').order('display_order',{ascending:true});
 if(error||!clients?.length){say('Add clients first.');return;}
 let client=clients.find(c=>String(c.id)===String(activeClientId));
 if(!client){const list=clients.map((c,i)=>`${i+1}. ${c.name}`).join('\n');const n=Number(prompt('Choose client number:\n'+list));if(!n||!clients[n-1])return;client=clients[n-1];activeClientId=client.id;}
 document.getElementById('portfolioClientHint').textContent='Adding content for '+client.name+'. Choose options and continue.';
 document.getElementById('portfolioContentType').value='video';
 document.getElementById('portfolioTitle').value='';document.getElementById('portfolioDescription').value='';
 document.getElementById('portfolioUrl').value='';document.getElementById('portfolioPublish').checked=true;
 updatePortfolioSourceOptions();
 const modal=document.getElementById('portfolioModal');modal.classList.add('show');modal.setAttribute('aria-hidden','false');
}
function updatePortfolioSourceOptions(){
 const type=document.getElementById('portfolioContentType').value,source=document.getElementById('portfolioSource'),wrap=document.getElementById('portfolioUrlWrap'),url=document.getElementById('portfolioUrl'),label=document.getElementById('portfolioUrlLabel');
 source.innerHTML=type==='video'?'<option value="upload">Upload Video</option><option value="youtube">YouTube Link</option><option value="instagram">Instagram Reel Link</option>':'<option value="image">Upload Image</option><option value="instagram">Instagram Post / Reel Link</option>';
 updatePortfolioUrlField();
}
function updatePortfolioUrlField(){
 const type=document.getElementById('portfolioContentType').value,source=document.getElementById('portfolioSource').value,wrap=document.getElementById('portfolioUrlWrap'),url=document.getElementById('portfolioUrl'),label=document.getElementById('portfolioUrlLabel');
 const needsUrl=source==='youtube'||source==='instagram';wrap.classList.toggle('hidden',!needsUrl);url.required=needsUrl;
 label.textContent=source==='youtube'?'YouTube Video URL':'Public Instagram Post / Reel URL';
 url.placeholder=source==='youtube'?'https://youtu.be/...':'https://www.instagram.com/reel/...';
}
function closePortfolioModal(){const modal=document.getElementById('portfolioModal');modal.classList.remove('show');modal.setAttribute('aria-hidden','true');}
document.getElementById('portfolioContentType').addEventListener('change',updatePortfolioSourceOptions);
document.getElementById('portfolioSource').addEventListener('change',updatePortfolioUrlField);
document.getElementById('portfolioCancel').addEventListener('click',closePortfolioModal);
document.getElementById('portfolioModal').addEventListener('click',e=>{if(e.target.id==='portfolioModal')closePortfolioModal();});
document.getElementById('portfolioForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const type=document.getElementById('portfolioContentType').value,source=document.getElementById('portfolioSource').value;
 const title=document.getElementById('portfolioTitle').value.trim(),description=document.getElementById('portfolioDescription').value.trim();
 const record={client_id:activeClientId,content_type:type,title,description,is_published:document.getElementById('portfolioPublish').checked};
 if(source==='youtube'){
  const value=document.getElementById('portfolioUrl').value.trim();if(!youtubeId(value)){say('Please enter a valid YouTube video URL.');return;}record.youtube_url=value;
 }
 if(source==='instagram'){
  const value=document.getElementById('portfolioUrl').value.trim(),permalink=instagramPermalink(value);if(!permalink){say('Please enter a valid public Instagram Post / Reel URL.');return;}record.instagram_url=permalink;
 }
 closePortfolioModal();
 if(source==='upload'||source==='image'){
  const picker=document.getElementById('filePicker');picker.value='';picker.accept=type==='post'?'image/*':'video/mp4,video/webm,video/quicktime';
  currentUpload={pendingRecord:record,table:'client_portfolio_items',column:type==='post'?'image_url':'video_file_url',kind:type==='post'?'image':'video'};
  offerFilePicker(type==='post'?'Choose the post image from your phone.':'Choose the video from your phone.');return;
 }
 say('Saving content...');const {error}=await db.from('client_portfolio_items').insert(record);
 if(error){say(error.message);return;}say(record.instagram_url?'Instagram content added successfully.':'YouTube video added successfully.');loadRecords();
});

function youtubeId(url){try{const u=new URL(url);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1);if(u.hostname.includes('youtube.com'))return u.searchParams.get('v')||u.pathname.split('/').filter(Boolean).pop();}catch(e){}return ''; }
function instagramPermalink(value){try{const u=new URL(value.trim());if(!['instagram.com','www.instagram.com'].includes(u.hostname.toLowerCase())||u.protocol!=='https:')return '';const parts=u.pathname.split('/').filter(Boolean);if(parts.length<2||!['p','reel','tv'].includes(parts[0]))return '';return 'https://www.instagram.com/'+parts[0]+'/'+encodeURIComponent(parts[1])+'/';}catch(e){return '';}}
async function addSpotlightItem(){
 const type=prompt('Type VIDEO or ANNOUNCEMENT','VIDEO');if(!type)return;const t=type.trim().toLowerCase();if(!['video','announcement'].includes(t)){say('Enter VIDEO or ANNOUNCEMENT.');return;}
 const title=prompt('Title:');if(!title)return;const description=prompt('Description / announcement text (optional)','');if(description===null)return;
 const row={title,content_type:t,description,is_published:confirm('Publish now?'),is_highlight:currentTable==='highlights'};
 if(t==='video'){
   const method=prompt('Video source: type UPLOAD for mobile video file, or YOUTUBE for YouTube link','UPLOAD');if(!method)return;
   if(method.trim().toLowerCase()==='youtube'){const url=prompt('YouTube video URL:');if(!url)return;if(!youtubeId(url)){say('Invalid YouTube URL.');return;}row.youtube_url=url.trim();}
   else if(method.trim().toLowerCase()!=='upload'){say('Type UPLOAD or YOUTUBE.');return;}
 }
 if(t==='video'&&!row.youtube_url){const p=document.getElementById('filePicker');p.value='';p.accept='video/mp4,video/webm,video/quicktime';currentUpload={pendingRecord:row,table:'spotlight_items',column:'video_file_url',kind:'video'};offerFilePicker('Tap Choose file from phone to select video file.');return;}
 const {error}=await db.from('spotlight_items').insert(row);if(error){say(error.message);return;}say('Spotlight content added.');loadRecords();
}
async function editItem(id){if(currentTable==='client_portfolio'){const {data,error}=await db.from('client_portfolio_items').select('*').eq('id',id).single();if(error){say(error.message);return;}const title=prompt('Title',data.title||'');if(title===null)return;const desc=prompt('Description',data.description||'');if(desc===null)return;const pub=confirm('Published? OK = yes, Cancel = draft');const changes={title,description:desc,is_published:pub};if(data.instagram_url){const url=prompt('Public Instagram URL (leave blank to remove)',data.instagram_url||'');if(url===null)return;if(url.trim()&&!instagramPermalink(url)){say('Invalid Instagram URL.');return;}changes.instagram_url=url.trim()?instagramPermalink(url):null;}else if(data.content_type==='video'&&data.youtube_url){const url=prompt('YouTube URL',data.youtube_url||'');if(url===null)return;if(!youtubeId(url)){say('Invalid YouTube URL.');return;}changes.youtube_url=url.trim();}const {error:e}=await db.from('client_portfolio_items').update(changes).eq('id',id);if(e){say(e.message);return;}say('Updated.');return loadRecords();}
 if(currentTable==='spotlight'||currentTable==='highlights'){const {data,error}=await db.from('spotlight_items').select('*').eq('id',id).single();if(error){say(error.message);return;}const title=prompt('Title',data.title||'');if(title===null)return;const desc=prompt('Description',data.description||'');if(desc===null)return;const changes={title,description:desc,is_published:confirm('Published? OK = yes, Cancel = draft')};if(data.content_type==='video'&&data.youtube_url){const url=prompt('YouTube URL',data.youtube_url||'');if(url===null)return;if(!youtubeId(url)){say('Invalid YouTube URL.');return;}changes.youtube_url=url;}const {error:e}=await db.from('spotlight_items').update(changes).eq('id',id);if(e){say(e.message);return;}say('Updated.');return loadRecords();}
 const {data,error}=await db.from(currentTable).select('*').eq('id',id).single();if(error){say(error.message);return;}const cfg=configs[currentTable],changes={};for(const [k,l] of cfg.fields){const old=Array.isArray(data[k])?data[k].join(', '):(data[k]??'');const v=prompt(l,old);if(v===null)return;changes[k]=k==='features'?v.split(',').map(x=>x.trim()).filter(Boolean):['display_order','rating'].includes(k)?Number(v||0):v;}cfg.flags.forEach(f=>changes[f]=confirm(f.replaceAll('_',' ')+' is currently '+(data[f]?'ON':'OFF')+'. OK = ON, Cancel = OFF'));const {error:e}=await db.from(currentTable).update(changes).eq('id',id);if(e){say(e.message);return;}say('Updated.');loadRecords();}
async function deleteItem(id){if(!confirm('Delete this content permanently?'))return;const table=currentTable==='client_portfolio'?'client_portfolio_items':(currentTable==='spotlight'||currentTable==='highlights')?'spotlight_items':currentTable;const {error}=await db.from(table).delete().eq('id',id);if(error){say(error.message);return;}say('Deleted.');loadRecords();}
function uploadMedia(id){currentUpload={id,table:currentTable,column:currentTable==='clients'?'logo_url':'cover_image_url'};const p=document.getElementById('filePicker');p.value='';p.accept='image/jpeg,image/png,image/webp,image/gif';p.click();}
document.getElementById('filePicker').addEventListener('change',async e=>{
 const file=e.target.files[0];if(!file||!currentUpload)return;let {id,table,column,kind='image',pendingRecord}=currentUpload;
 const imageTypes=['image/jpeg','image/png','image/webp','image/gif'];const videoTypes=['video/mp4','video/webm','video/quicktime'];
 if(kind==='image'&&!imageTypes.includes(file.type)){say('Choose JPG, PNG, WEBP or GIF image.');return;}
 if(kind==='video'&&!videoTypes.includes(file.type)){say('Choose MP4, WEBM or MOV video.');return;}
 if(file.size>50*1024*1024){say('Free storage upload limit is 50 MB per file.');return;}
 if(pendingRecord){say('Saving content and uploading file...');const {data:created,error:insertErr}=await db.from(table).insert(pendingRecord).select().single();if(insertErr){say(insertErr.message);currentUpload=null;return;}id=created.id;currentUpload={id,table,column,kind};}
 const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=(kind==='video'?'videos/':'posts/')+Date.now()+'-'+safeName;
 say(kind==='video'?'Uploading video... please wait.':'Uploading image...');
 const {error:up}=await db.storage.from('royal-portfolio').upload(path,file,{upsert:false});if(up){say(up.message);return;}
 const {data}=db.storage.from('royal-portfolio').getPublicUrl(path);const {error}=await db.from(table).update({[column]:data.publicUrl}).eq('id',id);
 if(error){say('Uploaded but database save failed: '+error.message);return;}
 say(kind==='video'?'Video uploaded and saved successfully.':'Image uploaded successfully.');currentUpload=null;loadRecords();
});
document.getElementById('records').addEventListener('click',e=>{const filter=e.target.closest('button[data-filter]');if(filter){portfolioTypeFilter=filter.dataset.filter;loadRecords();return;}const b=e.target.closest('button[data-action]');if(!b)return;const id=b.dataset.id,action=b.dataset.action;if(action==='manage-portfolio'){activeClientId=id;portfolioTypeFilter='all';currentTable='client_portfolio';setTabs();say('');loadRecords();return;}if(action==='edit')editItem(id);if(action==='delete')deleteItem(id);if(action==='upload')uploadMedia(id);if(action==='upload-highlight-video'){currentUpload={id,table:'spotlight_items',column:'video_file_url',kind:'video'};const p=document.getElementById('filePicker');p.value='';p.accept='video/mp4,video/webm,video/quicktime';p.click();return;}if(action==='upload-item'){currentUpload={id,table:'client_portfolio_items',column:'image_url'};const p=document.getElementById('filePicker');p.value='';p.accept='image/jpeg,image/png,image/webp,image/gif';p.click();}});
document.getElementById('records').addEventListener('change',e=>{if(e.target.id==='portfolioClient'){activeClientId=e.target.value;portfolioTypeFilter='all';loadRecords();}});
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-table]');if(!b)return;currentTable=b.dataset.table;say('');loadRecords();});
db.auth.getSession().then(({data})=>{if(data.session)showApp();});db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){document.getElementById('app').style.display='none';document.getElementById('loginBox').style.display='block';}});
</script>
</body>
